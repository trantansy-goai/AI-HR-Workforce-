# Every pull request into `main` is checked (format, analyze, test), then a
# staging Android build is uploaded to Firebase App Distribution so QA can
# verify it before merge. Setup: docs/CI_CD.md.
name: PR build → Firebase App Distribution

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A new push to the same PR cancels the build that is still running.
concurrency:
  group: pr-distribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Quality gates
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android → App Distribution
    needs: verify
    # Secrets are not available to PRs from forks.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
      TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'qa' }}
    steps:
      - name: Check required secrets
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          [ -n "$FIREBASE_APP_ID" ] || { echo "::error::Secret FIREBASE_ANDROID_APP_ID is not set"; missing=1; }
          [ -n "$SERVICE_ACCOUNT" ] || { echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_JSON is not set"; missing=1; }
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Optional: with a release keystore QA can install each build over the
      # previous one. Without it the APK is signed with a throwaway debug key.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; signing with a debug key (QA must uninstall before installing a new build)."
          fi

      - name: Build staging APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build apk --release
          --dart-define-from-file=config/staging.json
          --build-number=${{ github.run_number }}

      # PR title/branch go through env vars, never inline `${{ }}` in the script.
      - name: Write release notes
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            if [ -n "$PR_NUMBER" ]; then echo "PR #$PR_NUMBER: $PR_TITLE"; fi
            echo "Branch: $HEAD_REF (${HEAD_SHA:0:7}) by $PR_AUTHOR"
            echo "Env: staging · build ${{ github.run_number }}"
            echo "CI: $RUN_URL"
          } > "$RUNNER_TEMP/release-notes.txt"
          cat "$RUNNER_TEMP/release-notes.txt"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Upload to Firebase App Distribution
        run: >-
          npx --yes firebase-tools@14 appdistribution:distribute
          build/app/outputs/flutter-apk/app-release.apk
          --app "$FIREBASE_APP_ID"
          --groups "$TESTER_GROUPS"
          --release-notes-file "$RUNNER_TEMP/release-notes.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: goai-staging-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Summary
        run: |
          {
            echo "### Android staging build ${{ github.run_number }} distributed"
            echo "Tester groups: \`$TESTER_GROUPS\`"
            echo
            cat "$RUNNER_TEMP/release-notes.txt"
          } >> "$GITHUB_STEP_SUMMARY"
