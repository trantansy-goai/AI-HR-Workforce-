  path_provider: ^2.1.6
  permission_handler: ^12.0.1
  record: ^7.1.1
  shared_preferences: ^2.5.5
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  cross_file: any

flutter:
